<main>
    <aside id="aside">
        <div class="barraDePesquisa">
            <div class="search">
                <input id="busca" type="text" placeholder="Matéria">
            </div>

            <hr>

            <div class="CriarMateria ">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" data-modal="modalMateria"
                     class="openModal" style="height: 20px;">
                    <path
                            d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z" />
                </svg>
                <button data-modal="modalMateria" class="openModal btnMateria">
                    Criar Matéria
                </button>

                <!-- modal matéria -->

                <div id="modalMateria" class="modal">

                    <div class="modalContent">
                        <div class="modalHeader">
                            <h2>Criar matéria</h2>
                            <span class="close">X</span>

                        </div>

                        <div class="containerInput">
                            <label for="nomeMateria">Nome</label>
                            <input id="nomeMateria" type="text" placeholder="Digite o nome da matéria">
                        </div>

                        <div>
                            <label>Cor</label>
                            <div class="containerCores">
                                <sapn class="cores" style="background-color: #F43545;"> </sapn>
                                <sapn class="cores" style="background-color: #FA8901;"> </sapn>
                                <sapn class="cores" style="background-color: #FAD717;"> </sapn>
                                <sapn class="cores" style="background-color: #00BA71;"> </sapn>
                                <sapn class="cores" style="background-color: #00C2DE;"> </sapn>
                                <sapn class="cores" style="background-color: #00418D;"> </sapn>
                                <sapn class="cores" style="background-color: #5F2879;"> </sapn>
                            </div>
                        </div>
                        <button class="btn btnCriarMateria">Criar matéria</button>
                    </div>

                </div>
            </div>

        </div>

        <div class="profile openModal" data-modal="modalPerfil">
            <svg width="30" height="30" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">

                        d="M17.5 17.0625C21.1258 17.0625 24.0625 14.1258 24.0625 10.5C24.0625 6.87422 21.1258 3.9375 17.5 3.9375C13.8742 3.9375 10.9375 6.87422 10.9375 10.5C10.9375 14.1258 13.8742 17.0625 17.5 17.0625ZM15.8758 20.125C10.4891 20.125 6.125 24.4891 6.125 29.8758C6.125 30.7727 6.85234 31.5 7.74922 31.5H27.2508C28.1477 31.5 28.875 30.7727 28.875 29.8758C28.875 24.4891 24.5109 20.125 19.1242 20.125H15.8758Z" />
            </svg>
            <p>nome-sobrenome</p>
        </div>



        <!-- modal perfil -->

        <div id="modalPerfil" class="modalPerfil modal">
            <div class="modalSair">
                <svg width="16" height="14" viewBox="0 0 16 14" fill="#0000000" xmlns="http://www.w3.org/2000/svg">
                    <path

            </div>
        </div>

    </aside>

    <aside class="asideNotas">
        <div class="containerHeader">
            <div class="titulo">
                <h4>Aula1</h4>
                <h5>Java</h5>
            </div>
            <div>
                <div class="btnDiv">
                    <button class="btn btnNotas" type="submit">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                             style="height: 12px; fill: #fff; margin: 0;

                <div class="nomeNota" >
                    <h4>Aula1</h4>
