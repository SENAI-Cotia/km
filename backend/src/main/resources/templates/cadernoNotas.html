<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/reset.css}">
    <link rel="stylesheet" th:href="@{/home.css}">
    <link rel="stylesheet" th:href="@{/homeCaderno.css}">
    <link rel="stylesheet" th:href="@{/cadernoNotas.css}">
    <title th:text="${caderno.name}">Caderno</title>
</head>

<body class="notesPage" th:attr="data-caderno-id=${caderno.id}">
<header>
    <div class="logo">
        <a th:href="@{/home}">
            <img th:src="@{/img/logo.png}" alt="notelab-logo" class="imagemLogo" style="height: 35px;">
        </a>
    </div>
    <div class="iconesNav">
        <button id="btnSidebar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H88V56H216V200Z"/>
            </svg>
        </button>
        <button id="btnDarkmode">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <path d="M320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576C388.8 576 451.3 548.8 497.3 504.6C504.6 497.6 506.7 486.7 502.6 477.5C498.5 468.3 488.9 462.6 478.8 463.4C473.9 463.8 469 464 464 464C362.4 464 280 381.6 280 280C280 207.9 321.5 145.4 382.1 115.2C391.2 110.7 396.4 100.9 395.2 90.8C394 80.7 386.6 72.5 376.7 70.3C358.4 66.2 339.4 64 320 64z"/>
            </svg>
        </button>
        <button id="sunDarkmode" class="sunDarkmode">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.99826 0.00347103C10.2899 0.00347103 10.5641 0.156196 10.7134 0.40958L12.6402 3.62374L16.2784 2.71086C16.5631 2.64144 16.8651 2.72475 17.07 2.92954C17.2748 3.13433 17.3581 3.43978 17.2887 3.72093L16.3756 7.35509L19.5938 9.2815C19.8438 9.43075 20 9.70496 20 9.99653C20 10.2881 19.8473 10.5623 19.5938 10.7116L16.3756 12.6414L17.2887 16.2756C17.3581 16.5602 17.2748 16.8622 17.07 17.067C16.8651 17.2718 16.5596 17.3586 16.2784 17.2891L12.6436 16.3763L10.7169 19.5939C10.5676 19.8438 10.2934 20 10.0017 20C9.71012 20 9.43586 19.8473 9.28658 19.5939L7.35636 16.3763L3.72158 17.2891C3.4369 17.3586 3.13834 17.2753 2.93005 17.0705C2.72175 16.8657 2.63843 16.5602 2.70786 16.2756L3.61743 12.6414L0.402708 10.715C0.152751 10.5623 0 10.2916 0 10C0 9.70844 0.152751 9.43422 0.40618 9.28497L3.6209 7.35856L2.70786 3.72093C2.63843 3.43631 2.71828 2.1378 2.92658 2.92954C3.13487 2.72128 3.4369 2.64144 3.72158 2.71086L7.35636 3.62027L9.28311 0.406109L9.3456 0.315863C9.50182 0.118015 9.74136 0 9.99826 0V0.00347103Z" fill="white"/>
            </svg>
        </button>
    </div>
</header>

<main>
    <aside id="aside">
        <div class="barraDePesquisa">
            <a class="backLink" th:href="@{/matter/{id}(id=${matter.id})}">Voltar</a>
            <div class="matterPageTitle">
                <span class="corCardMateria" th:style="'background-color:' + ${matter.color}"></span>
                <p th:text="${matter.name}">Materia</p>
            </div>
        </div>
        <div class="profile">
            <svg width="30" height="30" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.5 17.0625C21.1258 17.0625 24.0625 14.1258 24.0625 10.5C24.0625 6.87422 21.1258 3.9375 17.5 3.9375C13.8742 3.9375 10.9375 6.87422 10.9375 10.5C10.9375 14.1258 13.8742 17.0625 17.5 17.0625ZM15.8758 20.125C10.4891 20.125 6.125 24.4891 6.125 29.8758C6.125 30.7727 6.85234 31.5 7.74922 31.5H27.2508C28.1477 31.5 28.875 30.7727 28.875 29.8758C28.875 24.4891 24.5109 20.125 19.1242 20.125H15.8758Z"/>
            </svg>
            <p th:text="${username}">usuario</p>
        </div>
    </aside>

    <aside class="asideNotas" id="notesSidebar">
        <div class="containerHeader">
            <div class="titulo">
                <h4 th:text="${caderno.name}">Caderno</h4>
                <h5 th:text="${matter.name}">Materia</h5>
            </div>
            <p class="cadernoDescription" th:text="${caderno.description}">Descricao</p>
            <div class="btnDiv">
                <button class="btn btnNotas" id="btnNovaNota" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" style="height: 12px; fill: #fff; margin: 0;">
                        <path d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z"/>
                    </svg>
                    Nova nota
                </button>
                <button class="deleteCadernoTextButton deleteCadernoButton" type="button" th:attr="data-caderno-id=${caderno.id}">
                    Excluir caderno
                </button>
            </div>
            <hr style="margin: 10px 0;">
            <div class="listaNotas" id="listaNotas"></div>
        </div>
    </aside>

    <div class="notesSidebarOverlay" id="notesSidebarOverlay" hidden></div>

    <section class="containerAberto">
        <button class="notesSidebarToggle" id="notesSidebarToggle" type="button" aria-controls="notesSidebar" aria-expanded="false">
            Notas
        </button>
        <div class="nota noteEditorShell">
            <div class="estilizacao">
                <span class="matterHeaderColor" th:style="'background-color:' + ${matter.color}"></span>
                <input id="noteTitle" class="noteTitleInput" type="text" value="Nota sem título" disabled>
                <span id="autosaveStatus" class="autosaveStatus">Selecione ou crie uma nota</span>
            </div>
            <p id="noteEditDate" class="noteEditDate" hidden></p>
            <div class="editorToolbar" aria-label="Ferramentas de edição" hidden>
                <button type="button" data-command="undo" title="Desfazer">↶</button>
                <button type="button" data-command="redo" title="Refazer">↷</button>
                <button type="button" data-command="bold" title="Negrito"><strong>B</strong></button>
                <button type="button" data-command="italic" title="Itálico"><em>I</em></button>
                <button type="button" data-command="formatBlock" data-value="h2" title="Título">H2</button>
                <button type="button" data-command="insertUnorderedList" title="Lista">•</button>
                <button type="button" data-command="insertOrderedList" title="Lista numerada">1.</button>
            </div>
            <div id="noteEditor" class="noteEditor" contenteditable="true" data-placeholder="Escreva sua nota..." hidden></div>
            <div id="emptyNotesState" class="emptyNotesState">
                <h3>Nenhuma nota selecionada</h3>
                <p>Crie uma nova nota para começar.</p>
            </div>
        </div>
    </section>
</main>

<script th:src="@{/script.js}" defer></script>
</body>
</html>
