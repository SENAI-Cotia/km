<main>

        <div class="barraDePesquisa">

                <input id="busca" type="text" placeholder="Pesquisar">
            </div>

            <hr>

            <div class="CriarMateria ">

                     class="openModal" style="height: 20px;">

                </svg>
                <button data-modal="modalMateria" class="openModal btnMateria">
                    Criar Matéria
                </button>

                <!-- modal criar matéria -->

                <div id="modalMateria" class="modal">

                    <div class="modalContent">
                        <div class="modalHeader">
                            <h2>Criar matéria</h2>
                            <span class="close">X</span>

                        </div>

                        <div class="containerInput">
                            <label for="nomeMateria">Nome</label>
                            <input id="nomeMateria" type="text" placeholder="Digite o nome da matéria">
                        </div>

                        <div>
                            <label >Cor</label>
                            <div class="containerCores">
                                <sapn class="cores" style="background-color: #F43545;"> </sapn>
                                <sapn class="cores" style="background-color: #FA8901;"> </sapn>
                                <sapn class="cores" style="background-color: #FAD717;"> </sapn>
                                <sapn class="cores" style="background-color: #00BA71;"> </sapn>
                                <sapn class="cores" style="background-color: #00C2DE;"> </sapn>
                                <sapn class="cores" style="background-color: #00418D;"> </sapn>
                                <sapn class="cores" style="background-color: #5F2879;"> </sapn>
                            </div>
                        </div>
                        <button class="btn btnCriarMateria">Criar matéria</button>
                    </div>

                </div>
            </div>

            <div class="materias">
                <div class="cardMateria">
                    <div class="infoCard">
                        <span class="corCardMateria"></span>
                        <p>Java</p>
                    </div>

                    <div>
                        <button class="btnEditar">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"

    </aside>

    <section>
        <div class="containerCaderno">
            <h2>Meus cadernos</h2>
            <div class="btnDiv">
                <button data-modal="modalCaderno" class="btn criarCaderno openModal" type="submit">Criar

                                        d="M336 496L160 496C151.2 496 144 488.8 144 480L144 160C144 151.2 151.2 144 160 144L480 144C488.8 144 496 151.2 496 160L496 336L408 336C368.2 336 336 368.2 336 408L336 496zM476.1 384L384 476.1L384 408C384 394.7 394.7 384 408 384L476.1 384zM96 480C96 515.3 124.7 544 160 544L357.5 544C374.5 544 390.8 537.3 402.8 525.3L525.3 402.7C537.3 390.7 544 374.4 544 357.4L544 160C544 124.7 515.3 96 480 96L160 96C124.7 96 96 124.7 96 160L96 480z" />

                    <div>
                        <h4>titulo caderno</h4>
                        <h6>matéria</h6>
                    </div>

            </div>

        </div>

        <!-- Modal caderno -->
        <div class="modal" id="modalCaderno">
            <div class="modalContentCaderno">
                <div class="modalHeader">
                    <h2>Criar caderno</h2>
                    <span class="close">X</span>
                </div>
                <div class="containerInput">
                    <label for="nomeCaderno">Nome</label>
                    <input id="nomeCaderno" type="text" placeholder="Digite o nome da matéria">
                </div>
                <div class="containerInput">
                    <label for="materias">matéria</label>
                    <select id="materias" name="">
                        <option value="">java</option>
                        <option value="">Javascript</option>
                    </select>
                </div>
                <button class="btn criarCaderno ">Criar caderno</button>
            </div>
        </div>

    </section>
